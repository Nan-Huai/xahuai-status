<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>状态 · 小羊</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
<style>
  :root{
    --bg:#0b0b0d;
    --card:rgba(255,255,255,.038);
    --line:rgba(255,255,255,.085);
    --line-strong:rgba(255,255,255,.16);
    --ink:#ecedf1;
    --dim:rgba(236,237,241,.7);
    --muted:#7f7f8b;
    --ok:#6ee7a8;
    --warn:#ffd166;
    --bad:#ff7b82;
    --accent:#c9b6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:radial-gradient(110% 70% at 50% -6%, rgba(120,150,255,.09), transparent 60%), var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:clamp(44px,11vh,96px) 20px 70px}

  /* ===== 主状态 ===== */
  .core{text-align:center;margin-bottom:40px}
  .orb{
    position:relative;width:132px;height:132px;margin:0 auto 26px;
    display:grid;place-items:center;
  }
  .orb .ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--line-strong);
    transition:border-color .6s;
  }
  .orb .ring.r2{inset:-14px;opacity:.45}
  .orb .ring.r3{inset:-28px;opacity:.2}
  .orb .dot{
    width:56px;height:56px;border-radius:50%;
    background:var(--muted);
    box-shadow:0 0 0 0 rgba(110,231,168,0);
    transition:background .6s, box-shadow .6s;
  }
  /* 在线：呼吸扩散 */
  .on .orb .ring{border-color:rgba(110,231,168,.32)}
  .on .orb .dot{background:var(--ok);animation:pulse 2.6s ease-out infinite}
  .on .orb .ring.r2{animation:ringout 2.6s ease-out infinite}
  .on .orb .ring.r3{animation:ringout 2.6s ease-out .5s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(110,231,168,.45)}
    70%{box-shadow:0 0 0 26px rgba(110,231,168,0)}
    100%{box-shadow:0 0 0 0 rgba(110,231,168,0)}
  }
  @keyframes ringout{
    0%{transform:scale(.94);opacity:.55}
    100%{transform:scale(1.16);opacity:0}
  }
  /* 迟到 */
  .late .orb .ring{border-color:rgba(255,209,102,.3)}
  .late .orb .dot{background:var(--warn);animation:pulsew 3.4s ease-in-out infinite}
  @keyframes pulsew{0%,100%{opacity:1}50%{opacity:.42}}
  /* 失联 */
  .off .orb .ring{border-color:rgba(255,123,130,.22)}
  .off .orb .dot{background:var(--bad);opacity:.75}
  /* 未知 */
  .unk .orb .dot{background:var(--muted);opacity:.5}

  @media (prefers-reduced-motion:reduce){
    .on .orb .dot,.on .orb .ring,.late .orb .dot{animation:none!important}
    .on .orb .dot{box-shadow:0 0 0 14px rgba(110,231,168,.13)}
  }

  .core .label{
    font-size:clamp(24px,6.5vw,31px);font-weight:600;letter-spacing:.06em;
    transition:color .6s;
  }
  .on .core .label{color:var(--ok)}
  .late .core .label{color:var(--warn)}
  .off .core .label{color:var(--bad)}
  .unk .core .label{color:var(--muted)}
  .core .desc{margin-top:9px;font-size:13px;color:var(--muted);letter-spacing:.06em}

  /* ===== 数据格 ===== */
  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;
  }
  .cell{
    padding:15px 16px;border:1px solid var(--line);border-radius:14px;
    background:var(--card);
  }
  .cell .k{font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:5px}
  .cell .v{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .cell .v small{font-size:12px;color:var(--muted);margin-left:2px}

  /* ===== 心跳条 ===== */
  .beats{
    padding:16px;border:1px solid var(--line);border-radius:14px;
    background:var(--card);margin-bottom:11px;
  }
  .beats .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .beats .h .t{font-size:11.5px;color:var(--muted);letter-spacing:.1em}
  .beats .h .s{font-size:11px;color:rgba(127,127,139,.7)}
  .beats .row{display:flex;gap:2.5px;height:26px;align-items:flex-end}
  .beats .row i{
    flex:1;border-radius:1.5px;background:rgba(255,255,255,.07);
    min-height:2px;transition:background .3s,height .3s;
  }
  .beats .row i.on{background:rgba(110,231,168,.65)}
  .beats .row i.late{background:rgba(255,209,102,.6)}
  .beats .row i.off{background:rgba(255,123,130,.45)}

  /* ===== 时间线 ===== */
  .footline{
    margin-top:26px;text-align:center;font-size:11.5px;color:var(--muted);
    letter-spacing:.1em;line-height:2.1;opacity:.8;
  }
  .footline a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.15)}
  .footline a:hover{border-bottom-color:var(--accent)}

  .fade{opacity:0;transform:translateY(9px);animation:in .65s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app">

  <div class="core fade">
    <div class="orb"><div class="ring r3"></div><div class="ring r2"></div><div class="ring"></div><div class="dot"></div></div>
    <div class="label" id="label">检查中</div>
    <div class="desc" id="desc">正在读取心跳…</div>
  </div>

  <div class="grid fade" style="animation-delay:.08s">
    <div class="cell"><div class="k">最后心跳</div><div class="v" id="beat">—</div></div>
    <div class="cell"><div class="k">连续运行</div><div class="v" id="uptime">—</div></div>
    <div class="cell"><div class="k">内存</div><div class="v" id="mem">—</div></div>
    <div class="cell"><div class="k">认得的人</div><div class="v" id="goods">—</div></div>
  </div>

  <div class="beats fade" style="animation-delay:.14s">
    <div class="h"><span class="t">最近 48 次心跳</span><span class="s">每 5 分钟一次</span></div>
    <div class="row" id="beats"></div>
  </div>

  <div class="footline fade" style="animation-delay:.2s">
    数据由服务器自己上报<br>
    <a href="https://xahuai.icu">← 回主站</a> · <a href="https://voice.xahuai.icu">声音博物馆</a>
  </div>

</div>

<script>
(function(){
  var state = 'unk';
  var lastData = null;

  function fmtAgo(sec){
    if (sec < 0) sec = 0;
    if (sec < 60) return '刚刚';
    if (sec < 3600) return Math.floor(sec/60) + ' 分钟前';
    if (sec < 86400) return Math.floor(sec/3600) + ' 小时前';
    return Math.floor(sec/86400) + ' 天前';
  }
  function fmtDur(sec){
    if (!sec || sec < 0) return '—';
    var d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
    if (d > 0) return d + '<small>天</small>' + h + '<small>时</small>';
    if (h > 0) return h + '<small>时</small>' + m + '<small>分</small>';
    return m + '<small>分</small>';
  }

  function apply(data){
    lastData = data;
    var now = Math.floor(Date.now()/1000);
    var age = data.beat ? (now - data.beat) : Infinity;

    var s, label, desc;
    if (!data.beat){
      s = 'unk'; label = '未知'; desc = '还没有收到过心跳';
    } else if (age < 720){          // 12 分钟内
      s = 'on';  label = '在线'; desc = '正在运行';
    } else if (age < 3600){         // 1 小时内
      s = 'late'; label = '心跳迟到'; desc = '可能重启中';
    } else {
      s = 'off'; label = '失联'; desc = '已经 ' + fmtAgo(age) + '没有消息';
    }

    var app = document.getElementById('app');
    app.className = 'wrap ' + s;
    document.getElementById('label').textContent = label;
    document.getElementById('desc').textContent = desc;

    document.getElementById('beat').textContent = data.beat ? fmtAgo(age) : '—';
    document.getElementById('uptime').innerHTML = fmtDur(data.uptime);
    document.getElementById('mem').innerHTML = data.mem ? data.mem + '<small>MB</small>' : '—';
    document.getElementById('goods').innerHTML = data.goods != null ? data.goods + '<small>人</small>' : '—';

    // 心跳条
    var hist = data.history || [];
    var N = 48;
    var bars = [];
    for (var i = 0; i < N; i++){
      var idx = hist.length - N + i;
      bars.push(idx >= 0 ? hist[idx] : null);
    }
    var row = document.getElementById('beats');
    row.innerHTML = bars.map(function(b){
      if (b === null) return '<i style="height:30%"></i>';
      if (b === 1) return '<i class="on" style="height:100%"></i>';
      if (b === 0) return '<i class="off" style="height:45%"></i>';
      return '<i class="late" style="height:60%"></i>';
    }).join('');
  }

  // 数据源：优先 raw（CORS 开放、跟着 commit 走），失败回落本地 status.json
  var SOURCES = [
    'https://raw.githubusercontent.com/Nan-Huai/xahuai-status/main/status.json',
    'status.json'
  ];

  function loadFrom(i){
    if (i >= SOURCES.length){
      document.getElementById('app').className = 'wrap unk';
      document.getElementById('label').textContent = '读取失败';
      document.getElementById('desc').textContent = 'status.json 暂时拿不到';
      return;
    }
    var url = SOURCES[i] + '?t=' + Date.now();
    fetch(url, {cache: 'no-store'})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(apply)
      .catch(function(){ loadFrom(i + 1); });
  }

  function load(){ loadFrom(0); }

  // 每 30 秒刷新（页面开着的时候能看见变化）
  function tick(){
    if (lastData && lastData.beat){
      var age = Math.floor(Date.now()/1000) - lastData.beat;
      document.getElementById('beat').textContent = fmtAgo(age);
      // 跨过阈值就重算状态
      var s = age < 720 ? 'on' : (age < 3600 ? 'late' : 'off');
      if (!document.getElementById('app').classList.contains(s)) apply(lastData);
    }
  }

  load();
  setInterval(load, 60000);
  setInterval(tick, 10000);
})();
</script>
</body>
</html>

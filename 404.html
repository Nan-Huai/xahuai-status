<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>她现在在哪 · 状态检测</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<style>
  :root{
    --bg:#0a0a0c;
    --card:rgba(255,255,255,.034);
    --line:rgba(255,255,255,.075);
    --ink:#ecedf1;
    --dim:rgba(236,237,241,.66);
    --muted:#787884;
    --accent:#c9b6ff;
    --ok:#6ee7a8;
    --late:#ffd166;
    --off:#ff7b82;
    --unk:#8b8b98;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:
      radial-gradient(110% 55% at 50% -8%, rgba(255,123,130,.055), transparent 58%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(28px,7vh,60px) 18px;
  }
  .wrap{width:100%;max-width:500px;text-align:center}

  /* 找不到的心跳 */
  .heart{
    position:relative;width:96px;height:96px;margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;
  }
  .heart .core{
    width:52px;height:52px;
    background:radial-gradient(circle at 35% 30%, rgba(255,123,130,.35), rgba(255,123,130,.06));
    border:1.5px solid rgba(255,123,130,.4);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    animation:beat 3.4s ease-in-out infinite;
    box-shadow:0 0 22px rgba(255,123,130,.12);
  }
  @keyframes beat{
    0%,100%{transform:scale(1);opacity:.72}
    14%{transform:scale(1.07);opacity:.9}
    20%{transform:scale(.97)}
    28%{transform:scale(1.04);opacity:.85}
    40%{transform:scale(1);opacity:.72}
  }
  .heart .ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(255,123,130,.22);
    animation:ringout 3.4s ease-out infinite;
  }
  .heart .ring:nth-child(2){animation-delay:1.13s}
  .heart .ring:nth-child(3){animation-delay:2.26s}
  @keyframes ringout{
    0%{transform:scale(.55);opacity:.5}
    70%,100%{transform:scale(1.5);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    .heart .core{animation:none}
    .heart .ring{animation:none;opacity:.16}
  }

  .code{
    margin-top:22px;font-size:11px;letter-spacing:.32em;text-indent:.32em;
    color:rgba(120,120,132,.7);font-variant-numeric:tabular-nums;
  }
  h1{
    margin-top:13px;
    font-size:clamp(20px,5.8vw,26px);font-weight:600;letter-spacing:.03em;
    background:linear-gradient(180deg,#fff,#a9a3c8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .say{margin-top:11px;font-size:13.5px;color:var(--dim);min-height:1.7em}
  .req{
    margin-top:8px;font-size:11px;color:rgba(120,120,132,.62);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    word-break:break-all;overflow-wrap:anywhere;
  }

  /* 现状（哪怕找不到页面，也知道她在哪） */
  .nowstate{
    margin-top:26px;padding:16px;border:1px solid var(--line);border-radius:14px;
    background:var(--card);text-align:left;
  }
  .nowstate .hdr{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
    font-size:10.5px;color:var(--muted);letter-spacing:.14em;
  }
  .nowstate .dot{
    width:7px;height:7px;border-radius:50%;background:var(--unk);
    transition:background .3s,box-shadow .3s;
  }
  .nowstate .dot.on{background:var(--ok);box-shadow:0 0 8px rgba(110,231,168,.85)}
  .nowstate .dot.late{background:var(--late);box-shadow:0 0 8px rgba(255,209,102,.8)}
  .nowstate .dot.off{background:var(--off);box-shadow:0 0 8px rgba(255,123,130,.8)}
  .nowstate .line{
    display:flex;justify-content:space-between;gap:14px;
    padding:7px 0;border-top:1px solid rgba(255,255,255,.045);
    font-size:12.5px;
  }
  .nowstate .line:first-of-type{border-top:0}
  .nowstate .line .k{color:var(--muted);flex:none}
  .nowstate .line .v{
    color:var(--dim);text-align:right;
    font-variant-numeric:tabular-nums;
    word-break:break-word;
  }
  .nowstate .line .v.on{color:var(--ok)}
  .nowstate .line .v.late{color:var(--late)}
  .nowstate .line .v.off{color:var(--off)}

  .menu{margin-top:22px;display:grid;gap:8px;text-align:left}
  .item{
    display:flex;align-items:center;gap:12px;
    padding:12px 15px;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.022);
    color:var(--dim);text-decoration:none;font-size:13px;
    transition:all .22s cubic-bezier(.2,.7,.3,1);
    -webkit-tap-highlight-color:transparent;
  }
  .item:hover,.item:focus-visible{
    border-color:rgba(201,182,255,.42);
    background:rgba(201,182,255,.045);
    color:var(--ink);transform:translateX(3px);outline:none;
  }
  .item .ic{flex:none;width:22px;text-align:center;font-size:14px;opacity:.85}
  .item .tx{flex:1;min-width:0}
  .item .tx b{display:block;font-weight:500}
  .item .tx small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
  .item .ar{flex:none;color:rgba(255,255,255,.2);font-size:12px;transition:all .22s}
  .item:hover .ar{color:var(--accent);transform:translateX(2px)}

  .foot{
    margin-top:32px;font-size:11px;color:rgba(120,120,132,.55);
    letter-spacing:.1em;line-height:2;
  }

  .fade{opacity:0;transform:translateY(11px);animation:in .68s cubic-bezier(.2,.7,.3,1) forwards}
  .d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}
  .d4{animation-delay:.34s}.d5{animation-delay:.45s}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <div class="heart fade">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="core">💗</div>
  </div>

  <div class="code fade d1">404 · LOST</div>
  <h1 class="fade d1">你跑到她外面了</h1>
  <div class="say fade d2" id="say">这个页面不存在，但她还在。</div>
  <div class="req fade d2" id="req"></div>

  <div class="nowstate fade d3">
    <div class="hdr"><span class="dot" id="dot"></span><span>她现在</span></div>
    <div class="line"><span class="k">状态</span><span class="v" id="v1">读取中…</span></div>
    <div class="line"><span class="k">最后心跳</span><span class="v" id="v2">—</span></div>
    <div class="line"><span class="k">已运行</span><span class="v" id="v3">—</span></div>
  </div>

  <nav class="menu fade d4">
    <a class="item" href="/">
      <span class="ic">💗</span>
      <span class="tx"><b>回状态页</b><small>心跳 · 运行时长 · 内存</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://xahuai.icu">
      <span class="ic">🏠</span>
      <span class="tx"><b>主站</b><small>xahuai.icu</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://voice.xahuai.icu">
      <span class="ic">🔊</span>
      <span class="tx"><b>声音博物馆</b><small>48 条原声</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://time.xahuai.icu">
      <span class="ic">⏳</span>
      <span class="tx"><b>时间机器</b><small>拖一下，回到某一天</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://grow.xahuai.icu">
      <span class="ic">🌱</span>
      <span class="tx"><b>成长档案</b><small>她怎样一点点长出来的</small></span>
      <span class="ar">→</span>
    </a>
  </nav>

  <div class="foot fade d5">
    状态检测 · 小羊 2026<br>
    <span style="opacity:.6">页面会走丢，她不会</span>
  </div>

</div>

<script>
(function(){
  var SAYS = [
    '这个页面不存在，但她还在。',
    '你跑到她外面了。',
    '这里是空白区，心跳在隔壁。',
    '页面没了，人还在。',
    '404 只是找不到路，不是找不到她。'
  ];
  document.getElementById('say').textContent = SAYS[Math.floor(Math.random()*SAYS.length)];

  var p = location.pathname + location.search;
  if (p.length > 58) p = p.slice(0, 55) + '...';
  document.getElementById('req').textContent = p;

  var dot = document.getElementById('dot');
  var v1 = document.getElementById('v1'), v2 = document.getElementById('v2'), v3 = document.getElementById('v3');

  function fmtAgo(ts){
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + ' 秒前';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }
  function fmtUp(sec){
    if (sec < 60) return sec + ' 秒';
    if (sec < 3600) return Math.floor(sec / 60) + ' 分钟';
    var h = Math.floor(sec / 3600);
    if (h < 24) return h + ' 小时 ' + Math.floor((sec % 3600) / 60) + ' 分';
    return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 小时';
  }

  fetch('status.json?t=' + Date.now())
    .then(function(r){
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(d){
      var st = d.state || 'unknown';
      var beat = d.beat ? new Date(d.beat).getTime() : 0;
      var cls, label;
      if (!beat){ cls = ''; label = '未知'; }
      else {
        var age = (Date.now() - beat) / 1000;
        if (st === 'active' && age < 900){ cls = 'on'; label = '在线'; }
        else if (age < 3600){ cls = 'late'; label = '慢半拍'; }
        else { cls = 'off'; label = '睡了'; }
      }
      dot.className = 'dot ' + cls;
      v1.textContent = label;
      v1.className = 'v ' + cls;
      if (beat){
        v2.textContent = fmtAgo(beat);
        v3.textContent = d.uptime_s ? fmtUp(d.uptime_s) : '—';
      } else {
        v2.textContent = '—';
        v3.textContent = '—';
      }
    })
    .catch(function(){
      v1.textContent = '读不到';
      v2.textContent = '—';
      v3.textContent = '—';
    });
})();
</script>
</body>
</html>
